name: Build WT3020 16M Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wt3020-16mb
    paths:
      - '.github/workflows/build-wt3020-16m.yml'
      - 'target/linux/ramips/**'
      - 'tools/firmware-utils/**'
      - 'package/**'
      - 'feeds.conf.default'
      - 'include/**'

permissions:
  contents: read

concurrency:
  group: wt3020-16m-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Nexx WT3020 16M
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            qemu-utils ccache

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Create WT3020 16M build config
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7620=y
          CONFIG_TARGET_ramips_mt7620_DEVICE_nexx_wt3020-16m=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_dropbear=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_dnsmasq=y
          EOF
          make defconfig
          grep -E 'CONFIG_TARGET_ramips|CONFIG_TARGET_ramips_mt7620|wt3020-16m|CONFIG_PACKAGE_luci|CONFIG_PACKAGE_uhttpd' .config

      - name: Download sources
        run: make download -j8

      - name: Build firmware
        run: |
          make -j$(nproc) V=s || make -j1 V=s

      - name: Collect firmware files
        run: |
          mkdir -p artifacts
          cp -v bin/targets/ramips/mt7620/*wt3020-16m* artifacts/ || true
          cp -v bin/targets/ramips/mt7620/sha256sums artifacts/ || true
          cp -v bin/targets/ramips/mt7620/profiles.json artifacts/ || true
          cp -v bin/targets/ramips/mt7620/*.manifest artifacts/ || true
          echo 'Collected files:'
          find artifacts -maxdepth 1 -type f -printf '%f\n' | sort
          test -n "$(find artifacts -maxdepth 1 -type f -name '*wt3020-16m*' -print -quit)"

      - name: Upload WT3020 firmware
        uses: actions/upload-artifact@v4
        with:
          name: wt3020-16m-firmware-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
